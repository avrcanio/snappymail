services:
  snappymail:
    image: ${SNAPPYMAIL_IMAGE:-djmaze/snappymail:latest}
    container_name: snappymail
    restart: unless-stopped
    env_file:
      - .env
    entrypoint:
      - /bin/sh
      - /bootstrap/entrypoint-wrapper.sh
    environment:
      TZ: ${TZ:-Europe/Zagreb}
      DEBUG: ${SNAPPYMAIL_DEBUG:-false}
      UPLOAD_MAX_SIZE: ${SNAPPYMAIL_UPLOAD_MAX_SIZE:-25M}
      MEMORY_LIMIT: ${SNAPPYMAIL_MEMORY_LIMIT:-256M}
      SECURE_COOKIES: ${SNAPPYMAIL_SECURE_COOKIES:-true}
      WEBMAIL_TITLE: ${WEBMAIL_TITLE:-Finestar Webmail}
      SNAPPYMAIL_ADMIN_PASSWORD: ${SNAPPYMAIL_ADMIN_PASSWORD}
      SNAPPYMAIL_FORCE_HTTPS: ${SNAPPYMAIL_FORCE_HTTPS:-true}
      SNAPPYMAIL_CONTACTS_ENABLE: ${SNAPPYMAIL_CONTACTS_ENABLE:-true}
      SNAPPYMAIL_DB_HOST: ${SNAPPYMAIL_DB_HOST}
      SNAPPYMAIL_DB_PORT: ${SNAPPYMAIL_DB_PORT:-5432}
      SNAPPYMAIL_DB_NAME: ${SNAPPYMAIL_DB_NAME}
      SNAPPYMAIL_DB_USER: ${SNAPPYMAIL_DB_USER}
      SNAPPYMAIL_DB_PASSWORD: ${SNAPPYMAIL_DB_PASSWORD}
      MAIL_IMAP_HOST: ${MAIL_IMAP_HOST:-mail.finestar.hr}
      MAIL_IMAP_PORT: ${MAIL_IMAP_PORT:-993}
      MAIL_IMAP_SECURITY: ${MAIL_IMAP_SECURITY:-ssl}
      MAIL_SMTP_HOST: ${MAIL_SMTP_HOST:-mail.finestar.hr}
      MAIL_SMTP_PORT: ${MAIL_SMTP_PORT:-587}
      MAIL_SMTP_SECURITY: ${MAIL_SMTP_SECURITY:-starttls}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_SIEVE_ENABLED: ${MAIL_SIEVE_ENABLED:-false}
      MAIL_SIEVE_HOST: ${MAIL_SIEVE_HOST:-mail.finestar.hr}
      MAIL_SIEVE_PORT: ${MAIL_SIEVE_PORT:-4190}
      MAIL_SIEVE_SECURITY: ${MAIL_SIEVE_SECURITY:-starttls}
      MAIL_ALLOW_SELF_SIGNED: ${MAIL_ALLOW_SELF_SIGNED:-false}
    volumes:
      - ./docker-data/snappymail:/var/lib/snappymail
      - ./bin/entrypoint-wrapper.sh:/bootstrap/entrypoint-wrapper.sh:ro
    networks:
      - proxy
      - postgis
      # Reach mailserver on 993/587 via internal DNS (mail.finestar.hr -> container IP).
      # Without this, PHP resolves the public IP and the connection times out (hairpin).
      - hetzner_net
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.snappymail.rule=Host(`${WEBMAIL_HOST}`)
      - traefik.http.routers.snappymail.entrypoints=websecure
      - traefik.http.routers.snappymail.tls=true
      - traefik.http.routers.snappymail.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-cloudflare}
      - traefik.http.routers.snappymail-nextcloud.rule=Host(`cloud.finestar.hr`) && PathPrefix(`/webmail`)
      - traefik.http.routers.snappymail-nextcloud.entrypoints=websecure
      - traefik.http.routers.snappymail-nextcloud.tls=true
      - traefik.http.routers.snappymail-nextcloud.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-cloudflare}
      - traefik.http.routers.snappymail-nextcloud.middlewares=snappymail-nextcloud-strip@docker,snappymail-nextcloud-headers@docker
      - traefik.http.routers.snappymail-nextcloud.priority=110
      - traefik.http.routers.snappymail-assets.rule=Host(`cloud.finestar.hr`) && PathPrefix(`/snappymail`)
      - traefik.http.routers.snappymail-assets.entrypoints=websecure
      - traefik.http.routers.snappymail-assets.tls=true
      - traefik.http.routers.snappymail-assets.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-cloudflare}
      - traefik.http.routers.snappymail-assets.middlewares=snappymail-nextcloud-headers@docker
      - traefik.http.routers.snappymail-assets.priority=110
      - traefik.http.middlewares.snappymail-nextcloud-strip.stripprefix.prefixes=/webmail
      - traefik.http.middlewares.snappymail-nextcloud-headers.headers.customResponseHeaders.X-Frame-Options=SAMEORIGIN
      - traefik.http.services.snappymail.loadbalancer.server.port=8888
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "nc -z 127.0.0.1 8888 || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  proxy:
    external: true
  postgis:
    external: true
  hetzner_net:
    external: true
